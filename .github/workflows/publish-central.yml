name: Publish verified Android SDK to Maven Central
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful build-public run with the verified Android SDK
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the successful producer at this exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const id = process.env.ARTIFACT_RUN_ID;
          if (!/^\d+$/.test(id ?? '')) throw Error('A numeric build-public run ID is required');
          const run = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`]));
          if (run.status !== 'completed' || run.conclusion !== 'success'
            || run.path !== '.github/workflows/build-public.yml' || run.head_sha !== process.env.GITHUB_SHA) {
            throw Error('A successful build-public run at this exact source commit is required');
          }
          NODE
      - uses: actions/download-artifact@v4
        with:
          name: public-android
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/producer
      - name: Publish signed Maven Central bundle and public release identity
        run: |
          node tools/publish-central.mjs --sdk artifacts/producer/android --out artifacts/central --execute
          node tools/publish-release.mjs --manifest artifacts/central/release.json --execute
        env:
          GH_TOKEN: ${{ github.token }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          WEAPP_SIGNING_KEY: ${{ secrets.WEAPP_SIGNING_KEY }}
          WEAPP_SIGNING_PASSWORD: ${{ secrets.WEAPP_SIGNING_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-central-publication
          path: artifacts/central/
          retention-days: 30
          if-no-files-found: ignore
